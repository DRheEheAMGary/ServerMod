plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	// HuskHomes (William278) —— 官方 Fabric 构建
	maven {
		name = 'William278'
		url = 'https://repo.william278.net/releases'
	}
	// Text Placeholder API (Patbox)
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz'
	}
	// LuckPerms
	maven {
		name = 'LuckPerms'
		url = 'https://repo.lucko.me'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ------------------------------------------------------------------
	// 软依赖：全部 compileOnly，运行期用 FabricLoader.isModLoaded 探测。
	// ------------------------------------------------------------------
	compileOnly "net.william278.huskhomes:huskhomes-fabric:${project.huskhomes_version}"
	compileOnly "eu.pb4:placeholder-api:${project.placeholder_api_version}"
	compileOnly "net.luckperms:api:${project.luckperms_api_version}"
}

processResources {
	def props = [
		version      : project.version,
		loaderVersion: project.loader_version,
		mcVersion    : project.minecraft_version
	]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
